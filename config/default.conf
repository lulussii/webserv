server {
    listen 8080;
    root /home/lulussi/42/webserv2/www/html; 
    client_max_body_size 10M;
    
	location / {
        allow_methods GET POST DELETE;
        autoindex off;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        root /home/lulussi/42/webserv2/www/html/uploads; 
        upload_store /home/lulussi/42/webserv2/www/html/uploads;
    }
}