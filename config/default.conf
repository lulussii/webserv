server {
    listen 8080;
    root /home/mlaussel/webserv/www/html; 
    client_max_body_size 10M;
    
	location / {
        index index.html
        allow_methods GET POST DELETE;
        autoindex off;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        root /home/mlaussel/webserv/www/html/uploads; 
        upload_store /home/mlaussel/webserv/www/html/uploads;
    }
}